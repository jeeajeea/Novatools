<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- T shape -->
  <rect x="60" y="60" width="280" height="50" rx="25" fill="url(#grad)"/>
  <rect x="175" y="60" width="50" height="180" rx="25" fill="url(#grad)"/>
  
  <!-- Z shape top bar -->
  <rect x="60" y="260" width="280" height="50" rx="25" fill="url(#grad)"/>
  
  <!-- Z shape bottom bar -->
  <rect x="60" y="340" width="280" height="50" rx="25" fill="url(#grad)"/>
  
  <!-- Z diagonal - white cutout effect -->
  <path d="M 340 260 L 60 340 L 60 310 L 280 260 Z" fill="white"/>
</svg>
